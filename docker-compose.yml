# =============================================================
#  HRMS Platform — Docker Compose (Single Command Deployment)
#  docker compose up --build -d
# =============================================================
#
#  DB Architecture: Option B — Single PostgreSQL Instance,
#  separate database per service (logical isolation).
#  Option A (multiple instances) is commented below.
# =============================================================

version: "3.9"

services:
  # ─────────────── API GATEWAY ───────────────
  gateway:
    build: ./services/gateway/nginx
    container_name: hrms-gateway
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      students-service:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped

  # ═══════════════════════════════════════════
  #  OPTION B: Single Postgres — Multiple DBs
  # ═══════════════════════════════════════════
  hrms-db:
    image: postgres:16-alpine
    container_name: hrms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: postgres
    volumes:
      - hrms-db-data:/var/lib/postgresql/data
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── AUTH SERVICE ───────────────
  auth-service:
    build: ./services/auth-service
    container_name: hrms-auth
    env_file: ./services/auth-service/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────── EMPLOYEE SERVICE ───────────────
  employee-service:
    build: ./services/employee-service
    container_name: hrms-employee
    env_file: ./services/employee-service/.env.docker
    ports:
      - "8001:8001"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────── ATTENDANCE SERVICE ───────────────
  attendance-service:
    build: ./services/attendance-service
    container_name: hrms-attendance
    env_file: ./services/attendance-service/.env.docker
    ports:
      - "8002:8002"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────── STUDENTS SERVICE ───────────────
  students-service:
    build: ./services/students-service
    container_name: hrms-students
    env_file: ./services/students-service/.env.docker
    ports:
      - "8003:8003"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────── RABBITMQ (Event Broker) ───────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hrms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────── REDIS (Cache) ───────────────
  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3



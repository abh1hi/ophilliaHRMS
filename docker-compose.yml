# =============================================================
#  HRMS Platform — Docker Compose (SaaS / Multi-Tenant Edition)
#  Deploy entire system:
#      docker compose up --build -d
#
#  Deploy modular blocks (e.g. Core + HR only):
#      docker compose --profile core --profile hr up --build -d
#
#  Hardware Target: 1 vCPU, 4GB RAM minimum.
# =============================================================


x-resource-limits-api: &api-limits
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M

x-resource-limits-db: &db-limits
  deploy:
    resources:
      limits:
        cpus: '0.4'
        memory: 600M

x-resource-limits-broker: &broker-limits
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 500M

x-resource-limits-cache: &cache-limits
  deploy:
    resources:
      limits:
        cpus: '0.1'
        memory: 100M

x-resource-limits-frontend: &frontend-limits
  deploy:
    resources:
      limits:
        cpus: '0.2'
        memory: 256M

services:
  # ─────────────── FRONTEND (Vue 3) ───────────────
  # Profile: CORE
  frontend:
    profiles: ["core", "hr", "payroll", "student"]
    build: ./frontend-tailless-ophillia-hrms-vue
    container_name: hrms-frontend
    <<: *frontend-limits
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────── API GATEWAY ───────────────
  # Profile: CORE
  gateway:
    profiles: ["core", "hr", "payroll", "student"] # gateway always needs to be available
    build: ./services/gateway/nginx
    container_name: hrms-gateway
    <<: *api-limits
    ports:
      - "80:80"
    networks:
      - hrms-network
    restart: unless-stopped

  # ─────────────── POSTGRESQL (Single Master) ───────────────
  # Profile: CORE
  hrms-db:
    profiles: ["core"]
    image: postgres:16-alpine
    container_name: hrms-db
    <<: *db-limits
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: postgres
    volumes:
      - hrms-db-data:/var/lib/postgresql/data
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────── RABBITMQ (Event Broker) ───────────────
  # Profile: CORE
  rabbitmq:
    profiles: ["core"]
    image: rabbitmq:3.12-management-alpine
    container_name: hrms-rabbitmq
    <<: *broker-limits
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─────────────── REDIS (Cache) ───────────────
  # Profile: CORE
  redis:
    profiles: ["core"]
    image: redis:7-alpine
    container_name: hrms-redis
    <<: *cache-limits
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3


  # ─────────────── CORE SERVICES ───────────────

  # Profile: CORE
  auth-service:
    profiles: ["core"]
    build: ./services/auth-service
    container_name: hrms-auth
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 400M
    env_file: ./services/auth-service/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Profile: CORE (Generally required for most async tasks)
  notification-service:
    profiles: ["core"]
    build: ./services/notification-service
    container_name: hrms-notification
    <<: *api-limits
    env_file: ./services/notification-service/.env.docker
    ports:
      - "8007:8007"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Profile: CORE (Always on — consumes all HRMS events for audit trail)
  audit-service:
    profiles: ["core"]
    build: ./services/audit-service
    container_name: hrms-audit
    <<: *api-limits
    env_file: ./services/audit-service/.env.docker
    ports:
      - "8006:8006"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────── HR MODULE ───────────────

  employee-service:
    profiles: ["hr"]
    build: ./services/employee-service
    container_name: hrms-employee
    <<: *api-limits
    env_file: ./services/employee-service/.env.docker
    ports:
      - "8001:8001"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  attendance-service:
    profiles: ["hr"]
    build: ./services/attendance-service
    container_name: hrms-attendance
    <<: *api-limits
    env_file: ./services/attendance-service/.env.docker
    ports:
      - "8002:8002"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  leave-service:
    profiles: ["hr"]
    build: ./services/leave-service
    container_name: hrms-leave
    <<: *api-limits
    env_file: ./services/leave-service/.env.docker
    ports:
      - "8005:8005"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  payroll-service:
    profiles: ["hr"]
    build: ./services/payroll-service
    container_name: hrms-payroll
    <<: *api-limits
    env_file: ./services/payroll-service/.env.docker
    ports:
      - "8004:8004"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────── STUDENT MODULE ───────────────

  students-service:
    profiles: ["student"]
    build: ./services/students-service
    container_name: hrms-students
    <<: *api-limits
    env_file: ./services/students-service/.env.docker
    ports:
      - "8003:8003"
    depends_on:
      hrms-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


# ─────────────── VOLUMES & NETWORKS ───────────────
volumes:
  hrms-db-data:
  rabbitmq-data:
  redis-data:

networks:
  hrms-network:
    driver: bridge
    name: hrms-network

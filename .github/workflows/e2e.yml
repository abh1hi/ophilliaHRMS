name: E2E Tests

on:
  push:
    branches: [main, predev]
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly 2am UTC staging run

jobs:
  # Job 1: Fast mocked tests — always runs, REQUIRED to pass for merge
  e2e-mocked:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminhr-dashboard-ophilliahrms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: adminhr-dashboard-ophilliahrms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Start Vite dev server
        run: npm run dev &

      - name: Wait for Vite to be ready
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run mocked E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:5173

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mocked
          path: adminhr-dashboard-ophilliahrms/e2e/playwright-report/
          retention-days: 7

  # Job 2: Real backend smoke — runs on every PR when backend secrets are configured
  e2e-integration:
    runs-on: ubuntu-latest
    if: vars.E2E_BACKEND_AVAILABLE == 'true'
    defaults:
      run:
        working-directory: adminhr-dashboard-ophilliahrms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: adminhr-dashboard-ophilliahrms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Vite dev server
        run: npm run dev &

      - name: Wait for Vite to be ready
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run real backend smoke tests
        # Minimum per PR: login test against a real backend
        run: npx playwright test e2e/tests/auth/login-real.spec.ts --project=chromium
        env:
          CI: true
          RUN_INTEGRATION: '1'
          E2E_REAL_AUTH: '1'
          E2E_BASE_URL: http://localhost:5173
          VITE_API_GATEWAY_URL: ${{ secrets.E2E_API_GATEWAY_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          E2E_HR_EMAIL: ${{ secrets.E2E_HR_EMAIL }}
          E2E_HR_PASS: ${{ secrets.E2E_HR_PASS }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASS: ${{ secrets.E2E_SUPER_ADMIN_PASS }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-integration
          path: adminhr-dashboard-ophilliahrms/e2e/playwright-report/
          retention-days: 7

  # Job 3: Nightly staging smoke against deployed staging URL
  e2e-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: adminhr-dashboard-ophilliahrms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: adminhr-dashboard-ophilliahrms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke tests
        run: >
          npx playwright test
          e2e/tests/auth/login-mocked.spec.ts
          e2e/tests/dashboard/navigation.spec.ts
          --project=chromium
        env:
          CI: true
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: adminhr-dashboard-ophilliahrms/e2e/playwright-report/
          retention-days: 7

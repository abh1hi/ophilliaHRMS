worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────── Logging ────────────
    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ──────────── Security Headers ────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────── API Versioning ────────────
    add_header API-Version "v1" always;

    # ──────────── Rate Limiting Zones ────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;

    # ──────────── DNS Resolver (Docker internal) ────────────
    # Resolve at request-time so gateway survives service restarts / late starts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ──────────── HTTP → HTTPS redirect (production) ────────────
    # Uncomment this block and comment out the HTTP server below to enforce HTTPS:
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # ──────────── HTTPS (uncomment when certs are provisioned) ────────────
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/server.crt;
        # ssl_certificate_key /etc/nginx/certs/server.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ──────────── Request ID propagation ────────────
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ──────────── Timeouts (3s per HRMS rulebook) ────────────
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # ──────────── Health Checks ────────────
        location = /api/v1/auth/health {
            set $upstream_auth auth-service:8000;
            proxy_pass http://$upstream_auth/health;
        }
        location = /api/v1/employees/health {
            set $upstream_employee employee-service:8001;
            proxy_pass http://$upstream_employee/health;
        }
        location = /api/v1/attendance/health {
            set $upstream_attendance attendance-service:8002;
            proxy_pass http://$upstream_attendance/health;
        }
        location = /api/v1/students/health {
            set $upstream_students students-service:8003;
            proxy_pass http://$upstream_students/health;
        }
        location = /api/v1/audit/health {
            set $upstream_audit audit-service:8006;
            proxy_pass http://$upstream_audit/health;
        }
        location = /api/v1/payroll/health {
            set $upstream_payroll payroll-service:8004;
            proxy_pass http://$upstream_payroll/health;
        }
        location = /api/v1/leave/health {
            set $upstream_leave leave-service:8005;
            proxy_pass http://$upstream_leave/health;
        }
        location = /api/v1/notifications/health {
            set $upstream_notification notification-service:8007;
            proxy_pass http://$upstream_notification/health;
        }
        location = /api/v1/onboarding/health {
            set $upstream_onboarding onboarding-service:8008;
            proxy_pass http://$upstream_onboarding/health;
        }
        location = /api/v1/calendar/health {
            set $upstream_cal calendar-service:8009;
            proxy_pass http://$upstream_cal/health;
        }

        # Block /metrics from external access (internal Prometheus only)
        location = /metrics {
            return 403;
        }

        # ──────────── Gateway Health ────────────
        location = /health {
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"gateway","version":"1.0.0"}';
        }

        # ──────────── Frontend (Vue 3 SPA) ────────────
        location / {
            set $upstream_frontend frontend:3000;
            proxy_pass http://$upstream_frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ──────────── Auth Service ────────────
        location /api/v1/auth/login {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Correlation-ID, Idempotency-Key" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=auth_login burst=10 nodelay;
            set $upstream_auth auth-service:8000;
            proxy_pass http://$upstream_auth;
        }

        location /api/v1/auth {

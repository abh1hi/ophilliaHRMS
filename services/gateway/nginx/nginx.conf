worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────── Logging ────────────
    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ──────────── Security Headers ────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────── Rate Limiting Zones ────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;

    # ──────────── Upstream Services ────────────
    upstream auth_service {
        server auth-service:8000;
    }

    upstream employee_service {
        server employee-service:8001;
    }

    upstream attendance_service {
        server attendance-service:8002;
    }

    # Future services (uncomment when built):
    # upstream leave_service {
    #     server leave-service:8003;
    # }
    # upstream payroll_service {
    #     server payroll-service:8004;
    # }
    # upstream notification_service {
    #     server notification-service:8005;
    # }
    # upstream audit_service {
    #     server audit-service:8006;
    # }

    server {
        listen 80;
        server_name _;

        # ──────────── Request ID propagation ────────────
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ──────────── Timeouts (3s per HRMS rulebook) ────────────
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # ──────────── Gateway Health ────────────
        location /health {
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"gateway","version":"1.0.0"}';
        }

        # ──────────── Auth Service ────────────
        location /api/v1/auth/login {
            limit_req zone=auth_login burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        location /api/v1/auth {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # ──────────── Employee Service ────────────
        location /api/v1/employees {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://employee_service;
        }

        location /api/v1/departments {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://employee_service;
        }

        # ──────────── Attendance Service ────────────
        location /api/v1/attendance {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://attendance_service;
        }

        # ──────────── Future: Leave Service ────────────
        # location /api/v1/leave {
        #     limit_req zone=api_general burst=20 nodelay;
        #     proxy_pass http://leave_service;
        # }

        # ──────────── Future: Payroll Service ────────────
        # location /api/v1/payroll {
        #     limit_req zone=api_general burst=20 nodelay;
        #     proxy_pass http://payroll_service;
        # }

        # ──────────── Catch-all ────────────
        location / {
            return 404 '{"detail":"Route not found. Use /api/v1/{service}/..."}';
            add_header Content-Type application/json;
        }

        # ──────────── Error pages ────────────
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            return 503 '{"detail":"Service temporarily unavailable. Please retry."}';
            add_header Content-Type application/json;
        }

        error_page 429 /429.json;
        location = /429.json {
            return 429 '{"detail":"Too many requests. Please slow down."}';
            add_header Content-Type application/json;
        }
    }
}

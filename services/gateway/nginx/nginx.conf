        # ──────────── Calendar Service ────────────
        location /api/v1/calendar {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Correlation-ID, X-Internal-Token" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            set $upstream_cal calendar-service:8009;
            proxy_pass http://$upstream_cal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        # ──────────── Notification Service ────────────
        location /api/v1/notifications {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Correlation-ID, Idempotency-Key" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            set $upstream_notification notification-service:8007;
            proxy_pass http://$upstream_notification;
        }

        # ──────────── Error pages ────────────
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            add_header Content-Type application/json;
            return 503 '{"detail":"Service temporarily unavailable. Please retry."}';
        }

        error_page 429 /429.json;
        location = /429.json {
            add_header Content-Type application/json;
            return 429 '{"detail":"Too many requests. Please slow down."}';
        }
    }
}

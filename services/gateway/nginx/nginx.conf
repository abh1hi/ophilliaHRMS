worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────── Logging ────────────
    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ──────────── Security Headers ────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────── Rate Limiting Zones ────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;

    # ──────────── Upstream Services ────────────
    upstream auth_service {
        server auth-service:8000;
    }

    upstream employee_service {
        server employee-service:8001;
    }

    upstream attendance_service {
        server attendance-service:8002;
    }

    upstream students_service {
        server students-service:8003;
    }

    server {
        listen 80;
        server_name _;

        # ──────────── Request ID propagation ────────────
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ──────────── Timeouts (3s per HRMS rulebook) ────────────
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # ──────────── Health Checks ────────────
        # No CORS headers here — FastAPI CORSMiddleware handles them correctly.
        location = /api/v1/auth/health {
            proxy_pass http://auth_service/health;
        }
        location = /api/v1/employees/health {
            proxy_pass http://employee_service/health;
        }
        location = /api/v1/attendance/health {
            proxy_pass http://attendance_service/health;
        }
        location = /api/v1/students/health {
            proxy_pass http://students_service/health;
        }

        # ──────────── Gateway Health ────────────
        location = /health {
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"gateway","version":"1.0.0"}';
        }

        # ──────────── Global CORS preflight (OPTIONS) ────────────
        # Handles all unmatched preflight requests — must come first.
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            return 404 '{"detail":"Route not found. Use /api/v1/{service}/..."}';
            add_header Content-Type application/json;
        }

        # ──────────── Auth Service ────────────
        # CORS is handled exclusively by FastAPI CORSMiddleware — do NOT add_header here.
        location /api/v1/auth/login {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=auth_login burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        location /api/v1/auth {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # ──────────── Employee Service ────────────
        location /api/v1/employees {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://employee_service;
        }

        location /api/v1/departments {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://employee_service;
        }

        # ──────────── Attendance Service ────────────
        location /api/v1/attendance {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://attendance_service;
        }

        # ──────────── Students Service ────────────
        location /api/v1/students {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://students_service;
        }

        location /api/v1/classes {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://students_service;
        }

        location /api/v1/guardians {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://students_service;
        }

        # ──────────── Future: Leave Service ────────────
        # location /api/v1/leave {
        #     limit_req zone=api_general burst=20 nodelay;
        #     proxy_pass http://leave_service;
        # }

        # ──────────── Future: Payroll Service ────────────
        # location /api/v1/payroll {
        #     limit_req zone=api_general burst=20 nodelay;
        #     proxy_pass http://payroll_service;
        # }

        # ──────────── Error pages ────────────
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            add_header Content-Type application/json;
            return 503 '{"detail":"Service temporarily unavailable. Please retry."}';
        }

        error_page 429 /429.json;
        location = /429.json {
            add_header Content-Type application/json;
            return 429 '{"detail":"Too many requests. Please slow down."}';
        }
    }
}

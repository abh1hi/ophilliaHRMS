[pytest]
# Pytest Configuration for Payroll Service Tests (Phase 9B)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directory
testpaths = tests

# Custom markers for test organization
markers =
    unit: Unit tests for individual functions (fast, isolated)
    integration: Integration tests for complete workflows
    compliance: Compliance tests for India-specific statutory rules
    guard: Tests for Phase 9A production guards
    slow: Slow running tests (>1 second)
    asyncio: Async tests requiring asyncio

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Test timeout (seconds)
timeout = 10

# Minimum Python version
minversion = 3.10
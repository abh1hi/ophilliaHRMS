<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Onboarding Complete</title>
<style>
  body { margin: 0; padding: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .wrapper { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .header { background: #0f172a; padding: 32px 36px 24px; }
  .logo { color: #fff; font-size: 22px; font-weight: 700; }
  .logo span { color: #34d399; }
  .body { padding: 32px 36px; }
  .title { font-size: 24px; font-weight: 700; color: #0f172a; margin: 0 0 12px; }
  p { font-size: 15px; color: #475569; line-height: 1.6; }
  .progress { background: #e2e8f0; border-radius: 9999px; height: 10px; margin: 20px 0; }
  .progress-bar { background: #059669; height: 10px; border-radius: 9999px; width: {{ progress }}%; }
  .cta { display: inline-block; background: #0f172a; color: #fff; padding: 12px 28px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600; }
  .footer { background: #f8fafc; padding: 20px 36px; border-top: 1px solid #e2e8f0; }
  .footer p { font-size: 12px; color: #94a3b8; margin: 0; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="logo">Ophillia <span>HRMS</span></div>
  </div>
  <div class="body">
    <h1 class="title">🎉 Onboarding Complete!</h1>
    <p>Congratulations! Your organization's HRMS setup is now complete. Your team can start using all features immediately.</p>
    <div class="progress"><div class="progress-bar"></div></div>
    <p style="font-size:13px;color:#059669;font-weight:600;">{{ progress }}% complete</p>
    <a href="#" class="cta">Go to Dashboard →</a>
  </div>
  <div class="footer">
    <p>Ophillia HRMS · You received this because you completed the setup wizard.</p>
  </div>
</div>
</body>
</html>
